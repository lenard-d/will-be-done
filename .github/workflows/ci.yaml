name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, hyperdb-lib, api, slices]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint @apps/${{ matrix.package }}
        run: cd apps/${{ matrix.package }} && bun run lint

      - name: TypeCheck @apps/${{ matrix.package }}
        run: cd apps/${{ matrix.package }} && bun run ts

      - name: Test @apps/${{ matrix.package }}
        if: matrix.package == 'hyperdb-lib' || matrix.package == 'api'
        run: cd apps/${{ matrix.package }} && bun run test

      - name: Check import cycles @apps/${{ matrix.package }}
        if: matrix.package == 'hyperdb-lib'
        run: cd apps/${{ matrix.package }} && bun run lint:cycles

  web-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: cd apps/web && bun run playwright install --with-deps chromium

      - name: Run web e2e tests
        run: cd apps/web && bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
